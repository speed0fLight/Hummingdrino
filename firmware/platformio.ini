[env:uno_q]
platform = arduinoq
board = uno_q
framework = arduino
extra_scripts =
    pre:scripts/patch_uno_q_library_serials.py
lib_deps = 
    https://github.com/LiquidCGS/FastIMU
    https://github.com/eschnou/arduino-px4flow-i2c
